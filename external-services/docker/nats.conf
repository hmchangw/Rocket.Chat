# NATS Server Configuration with JetStream
server_name: rocketchat-nats
listen: 0.0.0.0:4222
http_port: 8222

# JetStream enabled
jetstream {
    store_dir: "/data/jetstream"
    max_memory_store: 256MB
    max_file_store: 2GB
}

# Simple logging
log_file: "/dev/stdout"
logtime: true

# Basic limits
max_connections: 1000
max_payload: 1MB