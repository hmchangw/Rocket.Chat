version: '3.8'

services:
  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/meteor
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"

networks:
  default:
    name: dev