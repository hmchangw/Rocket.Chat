version: '3.8'

services:
  app:
    image: hmchangw/node:14-esm-bookworm-slim
    container_name: app
    restart: always
    command: >
      bash -c "
      cd programs/server && npm i && cd - &&
      node main.js
      "
    ports:
      - "4000:3000"
    environment:
      DEPLOY_METHOD: docker
      NODE_ENV: production
      MONGO_URL: mongodb://mongo:27017/meteor?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongo:27017/local?replicaSet=rs0
      HOME: /tmp
      PORT: 3000
      ROOT_URL: http://localhost:3000
      Accounts_AvatarStorePath: /uploads
    volumes:
      - ../../output/bundle:/app

networks:
  default:
    name: dev